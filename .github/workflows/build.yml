name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Prepare patched python-for-android
        run: |
          rm -rf /home/runner/p4a-src
          git clone https://github.com/kivy/python-for-android /home/runner/p4a-src
          grep -rl "python -m pip install -U pip" /home/runner/p4a-src | xargs -r sed -i 's/python -m pip install -U pip/true/g'
          pip install -e /home/runner/p4a-src

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rahman-rahmati-apk
          path: bin/*.apk
